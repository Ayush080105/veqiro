[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --cov=agents
    --cov=core
    --cov=api
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=0
norecursedirs =
    venv
    .venv
    __pycache__
    .pytest_cache
    htmlcov
    .mypy_cache
    .ruff_cache
markers =
    integration: module interaction tests with external services mocked
    api: FastAPI route tests
asyncio_default_fixture_loop_scope = function
